<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมสุ่มการ์ดวัดดวง Ultimate Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; color: #ffffff; padding: 20px 0;
    }
    .container { text-align: center; width: 95%; max-width: 750px; }
    
    .auth-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px; border-radius: 18px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    input {
      padding: 12px 18px; font-size: 1rem; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.5); color: #fff;
      width: 80%; margin-bottom: 15px; outline: none;
    }
    button {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white; border: none; padding: 12px 28px;
      font-size: 1rem; font-weight: bold; border-radius: 25px;
      cursor: pointer; margin: 6px; transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; }
    .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    .toggle-link { color: #3498db; cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 10px; }

    .player-bar {
      background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .card {
      width: 220px; height: 320px; perspective: 1000px; margin: 20px auto; cursor: pointer;
    }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      text-align: center; transition: transform 0.8s; transform-style: preserve-3d;
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 15px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px;
    }
    .card-front { background: #2c3e50; border: 3px solid #fff; font-size: 3rem; }
    .card-back { background: #fff; color: #333; transform: rotateY(180deg); border: 3px solid #f1c40f; }
    .card-back img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎴 เกมสุ่มการ์ดออนไลน์</h1>

    <!-- AUTHENTICATION FORM -->
    <div class="auth-box" id="authBox">
      <h2 id="authTitle">🔑 เข้าสู่ระบบ</h2>
      <form id="authForm">
        <input type="email" id="emailInput" placeholder="อีเมล (เช่น user@game.com)" required><br>
        <input type="password" id="passwordInput" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" required><br>
        
        <button type="submit" id="authBtn">เข้าสู่ระบบ</button><br>
        <span class="toggle-link" id="toggleAuth">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</span>
      </form>
    </div>

    <!-- MAIN GAME CONTENT -->
    <div id="gameContent" style="display: none;">
      <div class="player-bar">
        <div>👤 ผู้เล่น: <strong id="playerDisplay">-</strong></div>
        <div>⚡ สปินคงเหลือ: <strong id="spinsDisplay" style="color: #f1c40f;">10</strong></div>
        <button id="logoutBtn" style="padding: 6px 15px; font-size: 0.85rem;">ออกจากระบบ</button>
      </div>

      <div class="card" id="card">
        <div class="card-inner" id="cardInner">
          <div class="card-front">❓<p style="font-size: 1rem;">แตะเพื่อสุ่ม</p></div>
          <div class="card-back">
            <span id="cardRarity" style="font-weight:bold; color:red;">N</span>
            <img id="cardImage" src="" alt="Card">
            <h3 id="cardTitle" style="margin: 5px 0;">ชื่อการ์ด</h3>
            <p id="cardDesc" style="font-size: 0.8rem; color: #666;">รายละเอียด</p>
          </div>
        </div>
      </div>

      <button id="drawBtn" class="btn-green">🎲 สุ่มการ์ด (ใช้ 1 สปิน)</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      get, 
      child 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyANzE04i1AQXO8oqUP6i8oqfMNW1GQlhB4",
      authDomain: "my-game-card.firebaseapp.com",
      databaseURL: "https://my-game-card-default-rtdb.firebaseio.com",
      projectId: "my-game-card",
      storageBucket: "my-game-card.firebasestorage.app",
      messagingSenderId: "718520908168",
      appId: "1:718520908168:web:211e865318c8516f3f623d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isRegisterMode = false;
    let currentUser = null;
    let playerData = { spins: 10, unlockedCards: [] };

    const gachaPool = [
      { id: 1, title: 'Ryoma (SNK)', rarity: 'UR', desc: 'สุดยอดซามูไร', image: 'https://via.placeholder.com/200x300/e74c3c/ffffff?text=Ryoma+UR' },
      { id: 2, title: 'ปีศาจขุมนรก', rarity: 'SSR', desc: 'สิ่งมีชีวิตจากความมืด', image: 'https://via.placeholder.com/200x300/9b59b6/ffffff?text=Demon+SSR' },
      { id: 3, title: 'อัศวินเกราะเหล็ก', rarity: 'SR', desc: 'ผู้พิทักษ์', image: 'https://via.placeholder.com/200x300/34495e/ffffff?text=Knight+SR' },
      { id: 4, title: 'สไลม์สีฟ้า', rarity: 'N', desc: 'มอนสเตอร์ทั่วไป', image: 'https://via.placeholder.com/200x300/2ecc71/ffffff?text=Slime+N' }
    ];

    // DOM Elements
    const authForm = document.getElementById('authForm');
    const authTitle = document.getElementById('authTitle');
    const authBtn = document.getElementById('authBtn');
    const toggleAuth = document.getElementById('toggleAuth');
    const logoutBtn = document.getElementById('logoutBtn');
    const drawBtn = document.getElementById('drawBtn');

    // Toggle Mode
    toggleAuth.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      authTitle.innerText = isRegisterMode ? '📝 สมัครสมาชิก' : '🔑 เข้าสู่ระบบ';
      authBtn.innerText = isRegisterMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
      toggleAuth.innerText = isRegisterMode ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิกที่นี่';
    });

    // Handle Login / Register Submit
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      authBtn.disabled = true;
      authBtn.innerText = 'กำลังประมวลผล...';

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          alert('สมัครสมาชิกสำเร็จ!');
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        console.error(error);
        alert('เกิดข้อผิดพลาด: ' + error.message);
      } finally {
        authBtn.disabled = false;
        authBtn.innerText = isRegisterMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
      }
    });

    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snapshot = await get(child(ref(db), `users/${user.uid}`));
        if (snapshot.exists()) {
          playerData = snapshot.val();
        } else {
          playerData = { email: user.email, spins: 10, unlockedCards: [] };
          await set(ref(db, `users/${user.uid}`), playerData);
        }
        
        document.getElementById('playerDisplay').innerText = user.email.split('@')[0];
        document.getElementById('spinsDisplay').innerText = playerData.spins;
        document.getElementById('authBox').style.display = 'none';
        document.getElementById('gameContent').style.display = 'block';
      } else {
        currentUser = null;
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('gameContent').style.display = 'none';
      }
    });

    // Logout
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Draw Card
    drawBtn.addEventListener('click', async () => {
      if (playerData.spins <= 0) return alert('สปินหมดแล้ว!');
      
      playerData.spins -= 1;
      document.getElementById('spinsDisplay').innerText = playerData.spins;

      const randomCard = gachaPool[Math.floor(Math.random() * gachaPool.length)];
      
      document.getElementById('cardRarity').innerText = randomCard.rarity;
      document.getElementById('cardImage').src = randomCard.image;
      document.getElementById('cardTitle').innerText = randomCard.title;
      document.getElementById('cardDesc').innerText = randomCard.desc;

      document.getElementById('cardInner').classList.toggle('flipped');
      await set(ref(db, `users/${currentUser.uid}`), playerData);
    });
  </script>
</body>
</html>
