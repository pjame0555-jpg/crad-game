<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมสุ่มการ์ดวัดดวง (Online & Trade)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: white;
      padding: 20px 0;
    }
    .container { text-align: center; width: 90%; max-width: 600px; }
    .login-box, .trade-box, .collection-section {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      margin-top: 20px;
    }
    input, select {
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 5px;
    }
    .player-bar {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card { width: 220px; height: 330px; perspective: 1000px; margin: 20px auto; cursor: pointer; }
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 15px; display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; padding: 15px; box-sizing: border-box;
    }
    .card-front { background: linear-gradient(45deg, #0f2027, #203a43, #2c5364); border: 4px solid #fff; justify-content: center; }
    .card-front span { font-size: 4rem; }
    .card-back { background: #fff; color: #333; transform: rotateY(180deg); border: 4px solid #f1c40f; box-shadow: 0 0 25px rgba(241, 196, 15, 1); }
    .rarity-badge { position: absolute; top: 10px; right: 10px; background: #333; color: #fff; padding: 2px 8px; border-radius: 10px; }
    .card-back img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-top: 15px; }
    button { background-color: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 20px; cursor: pointer; margin: 5px; }
    button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; border-radius: 12px; background-color: #7f8c8d; }
    .btn-green { background-color: #2ecc71; }
    .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; }
    .collection-item { background: #2a2a40; border-radius: 8px; padding: 8px; opacity: 0.3; filter: grayscale(100%); transition: all 0.3s; }
    .collection-item.unlocked { opacity: 1; filter: grayscale(0%); border: 2px solid #f1c40f; background: #fff; color: #333; }
    .collection-item img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; }
    
    /* Trade UI Styles */
    .trade-grid { display: flex; justify-content: space-around; align-items: center; margin-top: 15px; }
    .trade-col { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; width: 45%; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎴 เกมสุ่มการ์ดวัดดวง (Online)</h1>

    <!-- Login -->
    <div class="login-box" id="loginBox">
      <h2>👤 กรอกชื่อผู้เล่นเพื่อเริ่มเล่น</h2>
      <input type="text" id="usernameInput" placeholder="พิมพ์ชื่อผู้เล่น..." maxlength="15"><br>
      <button onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- Main Game -->
    <div class="game-content" id="gameContent" style="display: none;">
      <div class="player-bar">
        <span>👤: <strong id="playerDisplay">-</strong></span>
        <span>🎲 สุ่ม: <strong id="drawCountDisplay">0</strong> ครั้ง</span>
        <button class="btn-sm" onclick="logout()">ออกจากระบบ</button>
      </div>

      <div class="card" id="card">
        <div class="card-inner" id="cardInner">
          <div class="card-front"><span>❓</span><p>คลิกเพื่อเปิดการ์ด</p></div>
          <div class="card-back" id="cardBack">
            <span class="rarity-badge" id="cardRarity">N</span>
            <img id="cardImage" src="" alt="Card Image">
            <h2 id="cardTitle">ชื่อการ์ด</h2>
            <p id="cardDesc">รายละเอียดการ์ด</p>
          </div>
        </div>
      </div>

      <button id="drawBtn" onclick="drawCard()">🎲 สุ่มการ์ด</button>

      <!-- Section: Trade System -->
      <div class="trade-box">
        <h2>🔄 ระบบแลกเปลี่ยนการ์ด (Trade)</h2>
        <div id="tradeInit">
          <input type="text" id="targetPlayerInput" placeholder="พิมพ์ชื่อเพื่อนที่จะเทรด...">
          <button class="btn-green" onclick="startTrade()">สร้างห้องเทรด</button>
        </div>

        <div id="tradeRoom" style="display: none;">
          <p>กำลังเทรดกับ: <strong id="partnerName">-</strong></p>
          <div class="trade-grid">
            <div class="trade-col">
              <h4>การ์ดของคุณ</h4>
              <select id="myTradeCardSelect" onchange="updateMyOffer()"></select>
              <p id="myOfferStatus">สถานะ: รอการเลือก</p>
            </div>
            <div class="trade-col">
              <h4>การ์ดของอีกฝ่าย</h4>
              <p id="partnerOfferCard">ยังไม่เลือกการ์ด</p>
              <p id="partnerOfferStatus">สถานะ: รอเลือก</p>
            </div>
          </div>
          <button id="confirmTradeBtn" class="btn-green" onclick="confirmTrade()">✅ ยืนยันการเทรด</button>
          <button onclick="cancelTrade()">❌ ยกเลิก</button>
        </div>
      </div>

      <!-- Collection -->
      <div class="collection-section">
        <h2>📖 สมุดสะสมการ์ด (<span id="collectedCount">0</span>/<span id="totalCount">0</span>)</h2>
        <div class="collection-grid" id="collectionGrid"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANzE04i1AQXO8oqUP6i8oqfMNW1GQlhB4",
      authDomain: "my-game-card.firebaseapp.com",
      databaseURL: "https://my-game-card-default-rtdb.firebaseio.com",
      projectId: "my-game-card",
      storageBucket: "my-game-card.firebasestorage.app",
      messagingSenderId: "718520908168",
      appId: "1:718520908168:web:211e865318c8516f3f623d",
      measurementId: "G-9RLMD56WYS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const cards = [
      { id: 2, title: 'ปีศาจจากขุมนรก', rarity: 'SSR', desc: 'สิ่งมีชีวิตจากความมืดมิด พร้อมสูบวิญญาณ!', image: 'images/demon.jpe' }
    ];

    let playerData = { username: '', unlockedCards: [], drawCount: 0 };
    let isFlipped = false;
    let currentTradeId = null;
    let tradeListener = null;

    window.login = async function() {
      const usernameInput = document.getElementById('usernameInput').value.trim();
      if (!usernameInput) return alert('กรุณากรอกชื่อผู้เล่นก่อนครับ');

      playerData.username = usernameInput;
      const dbRef = ref(db);
      try {
        const snapshot = await get(child(dbRef, `players/${usernameInput}`));
        if (snapshot.exists()) {
          playerData = snapshot.val();
        } else {
          await saveDataOnline();
        }
        showGameContent();
        listenForTradeRequests();
      } catch (error) {
        alert("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
      }
    };

    window.logout = function() {
      if (currentTradeId) cancelTrade();
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('gameContent').style.display = 'none';
      document.getElementById('usernameInput').value = '';
    };

    async function saveDataOnline() {
      if (!playerData.username) return;
      await set(ref(db, 'players/' + playerData.username), playerData);
    }

    function showGameContent() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('gameContent').style.display = 'block';
      document.getElementById('playerDisplay').innerText = playerData.username;
      document.getElementById('drawCountDisplay').innerText = playerData.drawCount || 0;
      initCollection();
      updateTradeCardSelect();
    }

    function initCollection() {
      const grid = document.getElementById('collectionGrid');
      document.getElementById('totalCount').innerText = cards.length;
      grid.innerHTML = '';
      const unlockedList = playerData.unlockedCards || [];

      cards.forEach(card => {
        const isUnlocked = unlockedList.includes(card.id);
        const item = document.createElement('div');
        item.className = `collection-item ${isUnlocked ? 'unlocked' : ''}`;
        item.innerHTML = `<img src="${card.image}" alt="${card.title}"><div style="font-size:0.7rem; font-weight:bold;">${card.title}</div>`;
        grid.appendChild(item);
      });
      document.getElementById('collectedCount').innerText = unlockedList.length;
    }

    // --- ระบบการเทรด (TRADE SYSTEM) ---
    function updateTradeCardSelect() {
      const select = document.getElementById('myTradeCardSelect');
      select.innerHTML = '<option value="">-- เลือกการ์ดที่จะเสนอ --</option>';
      const unlockedList = playerData.unlockedCards || [];
      
      cards.forEach(card => {
        if (unlockedList.includes(card.id)) {
          select.innerHTML += `<option value="${card.id}">${card.title} (${card.rarity})</option>`;
        }
      });
    }

    window.startTrade = async function() {
      const targetPlayer = document.getElementById('targetPlayerInput').value.trim();
      if (!targetPlayer) return alert('กรุณากรอกชื่อเพื่อนก่อนครับ');
      if (targetPlayer === playerData.username) return alert('ไม่สามารถเทรดกับตัวเองได้');

      // ตรวจสอบว่าผู้เล่นปลายทางมีจริงไหม
      const snapshot = await get(child(ref(db), `players/${targetPlayer}`));
      if (!snapshot.exists()) return alert('ไม่พบชื่อผู้เล่นนี้ในระบบ');

      // สร้าง ID ห้องเทรด
      currentTradeId = [playerData.username, targetPlayer].sort().join('_trade_');
      
      const tradeData = {
        p1: playerData.username,
        p2: targetPlayer,
        p1_card: null,
        p2_card: null,
        p1_confirm: false,
        p2_confirm: false,
        status: 'active'
      };

      await set(ref(db, `trades/${currentTradeId}`), tradeData);
      openTradeUI(targetPlayer);
    };

    function listenForTradeRequests() {
      // คอยฟังคำชวนเทรดจากผู้เล่นคนอื่น
      const tradesRef = ref(db, 'trades');
      onValue(tradesRef, (snapshot) => {
        if (!snapshot.exists() || currentTradeId) return;
        const allTrades = snapshot.val();
        for (let id in allTrades) {
          const trade = allTrades[id];
          if ((trade.p1 === playerData.username || trade.p2 === playerData.username) && trade.status === 'active') {
            const partner = trade.p1 === playerData.username ? trade.p2 : trade.p1;
            if (confirm(`ผู้เล่น ${partner} ชวนคุณเทรดการ์ด ต้องการเข้าร่วมหรือไม่?`)) {
              currentTradeId = id;
              openTradeUI(partner);
            }
            break;
          }
        }
      });
    }

    function openTradeUI(partnerName) {
      document.getElementById('tradeInit').style.display = 'none';
      document.getElementById('tradeRoom').style.display = 'block';
      document.getElementById('partnerName').innerText = partnerName;
      updateTradeCardSelect();

      // ฟังก์ชัน Realtime ฟังการเปลี่ยนแปลงในห้องเทรด
      const tradeRef = ref(db, `trades/${currentTradeId}`);
      tradeListener = onValue(tradeRef, async (snapshot) => {
        if (!snapshot.exists()) {
          alert('การเทรดถูกยกเลิกแล้ว');
          resetTradeUI();
          return;
        }

        const data = snapshot.val();
        const isP1 = playerData.username === data.p1;
        const myCard = isP1 ? data.p1_card : data.p2_card;
        const partnerCard = isP1 ? data.p2_card : data.p1_card;
        const myConfirm = isP1 ? data.p1_confirm : data.p2_confirm;
        const partnerConfirm = isP1 ? data.p2_confirm : data.p1_confirm;

        // อัปเดตฝั่งคู่เทรด
        if (partnerCard) {
          const cObj = cards.find(c => c.id == partnerCard);
          document.getElementById('partnerOfferCard').innerText = `${cObj.title} (${cObj.rarity})`;
        } else {
          document.getElementById('partnerOfferCard').innerText = 'ยังไม่เลือกการ์ด';
        }
        document.getElementById('partnerOfferStatus').innerText = partnerConfirm ? '✅ ยืนยันแล้ว' : '⏳ กำลังเลือก/รอการยืนยัน';

        // เช็กถ้าทั้งคู่กด Confirm ครบ
        if (data.p1_confirm && data.p2_confirm && data.status === 'active') {
          await executeTradeSwap(data);
        }
      });
    }

    window.updateMyOffer = async function() {
      if (!currentTradeId) return;
      const cardId = document.getElementById('myTradeCardSelect').value;
      const snapshot = await get(child(ref(db), `trades/${currentTradeId}`));
      if (!snapshot.exists()) return;

      const data = snapshot.val();
      const isP1 = playerData.username === data.p1;

      if (isP1) {
        data.p1_card = cardId ? parseInt(cardId) : null;
        data.p1_confirm = false; // รีเซ็ตการยืนยันถ้าเปลี่ยนการ์ด
      } else {
        data.p2_card = cardId ? parseInt(cardId) : null;
        data.p2_confirm = false;
      }

      await set(ref(db, `trades/${currentTradeId}`), data);
    };

    window.confirmTrade = async function() {
      const cardId = document.getElementById('myTradeCardSelect').value;
      if (!cardId) return alert('กรุณาเลือกการ์ดที่จะนำมาแลกเปลี่ยนก่อนครับ');

      const snapshot = await get(child(ref(db), `trades/${currentTradeId}`));
      if (!snapshot.exists()) return;

      const data = snapshot.val();
      if (playerData.username === data.p1) data.p1_confirm = true;
      else data.p2_confirm = true;

      await set(ref(db, `trades/${currentTradeId}`), data);
      document.getElementById('confirmTradeBtn').disabled = true;
    };

    async function executeTradeSwap(tradeData) {
      // ทำการสลับการ์ดในระบบ
      tradeData.status = 'completed';
      await set(ref(db, `trades/${currentTradeId}`), tradeData);

      const isP1 = playerData.username === tradeData.p1;
      const giveCardId = isP1 ? tradeData.p1_card : tradeData.p2_card;
      const getCardId = isP1 ? tradeData.p2_card : tradeData.p1_card;

      // เอาการ์ดเก่าออก เพิ่มการ์ดใหม่เข้า
      playerData.unlockedCards = playerData.unlockedCards.filter(id => id !== giveCardId);
      if (!playerData.unlockedCards.includes(getCardId)) {
        playerData.unlockedCards.push(getCardId);
      }

      await saveDataOnline();
      alert('🎉 แลกเปลี่ยนการ์ดเรียบร้อยแล้ว!');

      // ลบห้องเทรดทิ้ง
      await remove(ref(db, `trades/${currentTradeId}`));
      resetTradeUI();
      initCollection();
    }

    window.cancelTrade = async function() {
      if (currentTradeId) {
        await remove(ref(db, `trades/${currentTradeId}`));
      }
      resetTradeUI();
    };

    function resetTradeUI() {
      currentTradeId = null;
      document.getElementById('tradeInit').style.display = 'block';
      document.getElementById('tradeRoom').style.display = 'none';
      document.getElementById('confirmTradeBtn').disabled = false;
      document.getElementById('myTradeCardSelect').value = '';
    }

    // --- ระบบการสุ่มการ์ดหลัก ---
    window.drawCard = function() {
      const cardInner = document.getElementById('cardInner');
      const btn = document.getElementById('drawBtn');
      btn.disabled = true;

      if (isFlipped) {
        cardInner.classList.remove('flipped');
        isFlipped = false;
        setTimeout(randomizeAndFlip, 600);
      } else {
        randomizeAndFlip();
      }
    };

    async function randomizeAndFlip() {
      const selectedCard = cards[0];
      playerData.drawCount = (playerData.drawCount || 0) + 1;
      document.getElementById('drawCountDisplay').innerText = playerData.drawCount;

      document.getElementById('cardRarity').innerText = selectedCard.rarity;
      document.getElementById('cardImage').src = selectedCard.image;
      document.getElementById('cardTitle').innerText = selectedCard.title;
      document.getElementById('cardDesc').innerText = selectedCard.desc;

      if (!playerData.unlockedCards) playerData.unlockedCards = [];
      if (!playerData.unlockedCards.includes(selectedCard.id)) {
        playerData.unlockedCards.push(selectedCard.id);
      }

      await saveDataOnline();
      initCollection();
      updateTradeCardSelect();

      document.getElementById('cardInner').classList.add('flipped');
      isFlipped = true;
      setTimeout(() => { document.getElementById('drawBtn').disabled = false; }, 600);
    }

    document.getElementById('card').addEventListener('click', window.drawCard);
  </script>
</body>
</html>
